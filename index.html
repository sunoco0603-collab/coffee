<title>コーヒー学習アプリ</title>
<meta name="theme-color" content="#6b4423">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>
// 起動時エラーを画面に可視化（真っ白画面の防止）
window.onerror = function(msg, srcUrl, line, col){
  try{
    var d = document.getElementById("boot-err");
    if(!d){
      d = document.createElement("div");
      d.id = "boot-err";
      d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#fdf0ef;color:#b91c1c;padding:10px 16px;font-size:13px;font-family:sans-serif;border-bottom:1px solid #f2c7c3;white-space:pre-wrap;";
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent = "アプリ内部でエラーが発生しました：" + msg + (line ? "（" + line + "行目）" : "");
  }catch(e){}
  return false;
};
</script>
<style>
:root{
  --bg:#f6f3ef; --card:#ffffff; --ink:#2a2118; --muted:#7a6d5e;
  --accent:#8b5e34; --accent-dark:#6b4423; --accent-soft:#f5ede3;
  --ok:#15803d; --ok-bg:#ecfdf3; --ok-line:#bbe7c9;
  --warn:#b45309; --warn-bg:#fff7e8; --warn-line:#f3ddb0;
  --err:#b91c1c; --err-bg:#fdf0ef; --err-line:#f2c7c3;
  --line:#e6ddd1; --code-bg:#2a2118; --code-ink:#e8e0d5;
  --acid:#c2410c; --bitter:#4a3520;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{font-size:15px;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  line-height:1.75;
}
button{font-family:inherit; cursor:pointer;}
/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 18px; background:var(--card); border-bottom:1px solid var(--line);
  box-shadow:0 1px 6px rgba(60,40,20,.07); flex-wrap:wrap;
}
.hd-left{display:flex; align-items:center; gap:10px;}
.logo{font-size:1.7rem;}
.app-title{font-weight:700; font-size:1.05rem; line-height:1.3;}
.app-sub{font-size:.72rem; color:var(--muted);}
.hd-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.overall{display:flex; align-items:center; gap:8px;}
.overall-bar{width:120px; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
#overall-fill{height:100%; width:0%; background:linear-gradient(90deg,#a97142,#6b4423); border-radius:99px; transition:width .7s cubic-bezier(.22,1,.36,1);}
#overall-pct{font-size:.82rem; color:var(--muted);}
.gear{font-size:1.2rem; background:none; border:none; padding:4px;}
/* ---------- tabs ---------- */
.tabbar{display:flex; gap:4px; flex-wrap:wrap; max-width:1180px; margin:0 auto; padding:10px 18px 0;}
.tab-btn{
  padding:8px 14px; border:1px solid var(--line); border-bottom:none;
  background:var(--card); color:var(--muted); border-radius:10px 10px 0 0;
  font-size:.9rem; font-weight:600;
}
.tab-btn.active{color:var(--accent-dark); background:var(--accent-soft); border-color:var(--accent);}
.wrap{max-width:1180px; margin:0 auto; padding:16px 18px 60px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
/* ---------- generic card ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px; margin-bottom:16px; transition:box-shadow .25s ease;
}
.card h3{font-size:1.05rem; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.muted{color:var(--muted); font-size:.85rem;}
.pill{font-size:.7rem; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:1px 8px;}
.pill.gray{background:#a49484;}
.pill.dark{background:#4a3520;}
.pill.season{background:#c2410c;}
.pill.esp{background:#3f3f46;}
.pill.ice{background:#0ea5e9;}
.pill.ok{background:var(--ok);}
.pill.order{background:#7c3aed;}
/* ---------- buttons ---------- */
.btn{
  padding:7px 14px; border:1px solid var(--line); border-radius:9px;
  background:var(--card); color:var(--ink); font-size:.88rem; font-weight:600;
}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-sm{padding:4px 10px; font-size:.8rem;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.btn:disabled{opacity:.5; cursor:default;}
/* ---------- meters ---------- */
.meter{margin:9px 0;}
.meter-head{display:flex; justify-content:space-between; align-items:baseline; font-size:.78rem; color:var(--muted); margin-bottom:3px;}
.meter-name{font-weight:700; color:var(--accent-dark);}
.meter-track{
  position:relative; height:14px; border-radius:99px; overflow:visible;
  background:linear-gradient(90deg,#f0b27a,#a0522d);
}
.meter-track.roast{background:linear-gradient(90deg,#d9b382,#3b2415);}
.meter-track.body{background:linear-gradient(90deg,#efe0cc,#8b5e34);}
.meter-dot{
  position:absolute; top:50%; width:13px; height:13px; border-radius:50%;
  background:#2a2118; border:2px solid #fff; transform:translate(-50%,-50%);
  box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.meter-dot.guess{background:#c2410c;}
.meter-dot.ans{background:#15803d;}
.meter-ends{display:flex; justify-content:space-between; font-size:.7rem; color:var(--muted); margin-top:2px;}
/* スライダー */
.slider-row{margin:14px 0;}
.slider-label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
.slider-label .nm{font-weight:700; font-size:.9rem; color:var(--accent-dark);}
.slider-label .val{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums;}
input[type=range]{width:100%; accent-color:var(--accent); height:26px;}
.slider-scale{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted);}
.judge-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:.85rem;}
.judge{padding:2px 9px; border-radius:7px; font-weight:700;}
.judge.perfect{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-line);}
.judge.close{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line);}
.judge.miss{background:var(--err-bg); color:var(--err); border:1px solid var(--err-line);}
/* ---------- quiz ---------- */
.choices{display:flex; flex-direction:column; gap:7px; margin:10px 0;}
.choice{
  text-align:left; padding:9px 13px; border:1px solid var(--line); border-radius:10px;
  background:var(--card); font-size:.92rem; color:var(--ink);
}
.choice:hover{border-color:var(--accent);}
.choice.correct{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok);}
.choice.wrong{background:var(--err-bg); border-color:var(--err-line); color:var(--err);}
.choice.disabled{pointer-events:none;}
.feedback{margin-top:10px; padding:10px 14px; border-radius:10px; font-size:.9rem; display:none;}
.feedback.show{display:block;}
.feedback.ok{background:var(--ok-bg); border:1px solid var(--ok-line);}
.feedback.ng{background:var(--err-bg); border:1px solid var(--err-line);}
.feedback.part{background:var(--warn-bg); border:1px solid var(--warn-line);}
.hint-box{background:var(--accent-soft); border-radius:9px; padding:8px 12px; margin-top:8px; font-size:.9rem;}
.blank{
  display:inline-block; min-width:5.5em; padding:0 6px; text-align:center;
  border-bottom:2px solid var(--accent); font-weight:700; color:var(--muted);
}
.blank.filled{color:var(--ok); border-bottom-color:var(--ok);}
.blank.wrongfill{color:var(--err); border-bottom-color:var(--err); text-decoration:line-through;}
.blank.cur{background:var(--accent-soft); color:var(--accent-dark);}
.q-desc{font-size:1rem; line-height:2.1; margin:10px 0;}
.q-name{font-size:1.3rem; font-weight:700; color:var(--accent-dark);}
.q-nameen{font-size:.82rem; color:var(--muted);}
.step-head{font-size:.78rem; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:1px 9px; display:inline-block; margin-bottom:8px;}
/* ---------- 図鑑 ---------- */
.filter-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
.filter-row select,.filter-row input{font-size:.85rem; padding:5px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
.zukan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
.p-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 17px;}
.p-card .nm{font-size:1.05rem; font-weight:700;}
.p-card .en{font-size:.75rem; color:var(--muted); margin-bottom:4px;}
.p-card .ct{font-size:.85rem; font-weight:700; color:var(--accent-dark); margin:5px 0;}
.p-card .ds{font-size:.85rem; color:var(--ink); margin-bottom:8px;}
.p-card .og{font-size:.78rem; color:var(--muted); text-align:right;}
.badges{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:5px;}
/* ---------- ホーム ---------- */
.heat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:7px;}
.heat{
  padding:7px 9px; border-radius:9px; font-size:.78rem; border:1px solid var(--line);
  background:var(--card); cursor:pointer; text-align:left; line-height:1.4; color:var(--ink);
}
.heat.l1{background:#f5ede3;} .heat.l2{background:#e2c9a8;} .heat.l3{background:#c89f6d;}
.heat.l4{background:#8b5e34; color:#fff; border-color:#6b4423;}
.heat .n{font-weight:700; display:block;}
.heat .s{font-size:.7rem; opacity:.85;}
.stat-row{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px;}
.stat{text-align:center;}
.stat .v{font-size:1.5rem; font-weight:700; color:var(--accent-dark);}
.stat .l{font-size:.75rem; color:var(--muted);}
/* ---------- 設定 ---------- */
textarea.import-area{width:100%; min-height:120px; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:Consolas,Menlo,monospace; font-size:.8rem;}
.st-log{font-family:Consolas,Menlo,monospace; font-size:.8rem; white-space:pre-wrap; background:var(--code-bg); color:var(--code-ink); border-radius:10px; padding:12px 14px; max-height:280px; overflow:auto;}
.st-ok{color:#4ade80;} .st-ng{color:#f87171;} .st-wn{color:#fbbf24;}
.edit-row{display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:.85rem;}
.edit-row .en{color:var(--muted); font-size:.75rem;}
.edit-row input[type=number]{width:60px; padding:4px 6px; border:1px solid var(--line); border-radius:7px; font-size:.85rem;}
.edit-head{display:grid; grid-template-columns:1fr auto auto auto; gap:8px; font-size:.72rem; color:var(--muted); font-weight:700; padding-bottom:4px;}
.edited{background:var(--warn-bg);}
.empty{color:var(--muted); padding:24px; text-align:center;}
hr.sep{border:none; border-top:1px solid var(--line); margin:18px 0;}
.section-title{font-size:1.15rem; font-weight:700; margin:6px 0 12px;}
.sess-bar{display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--muted); margin-bottom:10px; flex-wrap:wrap; gap:8px;}
@media (max-width:480px){
  .edit-row,.edit-head{grid-template-columns:1fr; gap:4px;}
  .edit-row{padding:10px 0;}
  .heat-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
}
</style>
</head>

// ==== ENGINE ====
// -------- localStorage キー --------
var LS = {
  progress:"rikei.coffee.progress",
  stats:"rikei.coffee.stats",
  overrides:"rikei.coffee.overrides",
  settings:"rikei.coffee.settings"
};

// -------- メーター定義 --------
var METERS = [
  {key:"taste", name:"テイストバランス", min:1, max:10, lo:"酸味", hi:"苦味", cls:""},
  {key:"body",  name:"ボディ",           min:1, max:4,  lo:"ライト", hi:"フル", cls:"body"},
  {key:"roast", name:"ロースト",         min:1, max:7,  lo:"浅煎り", hi:"深煎り", cls:"roast"}
];
function meterDef(key){ for(var i=0;i<METERS.length;i++) if(METERS[i].key===key) return METERS[i]; return null; }

var CAT_LABEL = {blend:"ブレンド", straight:"ストレート", order:"お取り寄せ"};

// -------- グローバル状態 --------
var state = {
  progress: {},   // productId -> {desc:bool, meter:bool, reverse:bool}
  stats: {},      // productId -> {attempts, correct, lastSeen}
  overrides: {},  // productId -> {taste,body,roast}
  settings: {sessionLen:10}
};

function loadState(){
  try{ var p=JSON.parse(localStorage.getItem(LS.progress)); if(p && typeof p==="object") state.progress=p; }catch(e){}
  try{ var s=JSON.parse(localStorage.getItem(LS.stats)); if(s && typeof s==="object") state.stats=s; }catch(e){}
  try{ var o=JSON.parse(localStorage.getItem(LS.overrides)); if(o && typeof o==="object") state.overrides=o; }catch(e){}
  try{ var t=JSON.parse(localStorage.getItem(LS.settings)); if(t && typeof t==="object") state.settings=Object.assign(state.settings,t); }catch(e){}
  if(!state.settings.sessionLen) state.settings.sessionLen=10;
}
function saveProgress(){ try{ localStorage.setItem(LS.progress, JSON.stringify(state.progress)); }catch(e){} }
function saveStats(){ try{ localStorage.setItem(LS.stats, JSON.stringify(state.stats)); }catch(e){} }
function saveOverrides(){ try{ localStorage.setItem(LS.overrides, JSON.stringify(state.overrides)); }catch(e){} }
function saveSettings(){ try{ localStorage.setItem(LS.settings, JSON.stringify(state.settings)); }catch(e){} }

// -------- 汎用 --------
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pickN(pool, n){
  var uniq=[], seen={};
  pool.forEach(function(x){ if(!seen[x]){ seen[x]=1; uniq.push(x); } });
  return shuffle(uniq).slice(0, n);
}
function sample(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// -------- 商品アクセス（override 適用） --------
// メーター値は必ずこの関数経由で読む（設定タブでの修正を出題・図鑑の双方へ反映するため）
function meterOf(p, key){
  var ov = state.overrides[p.id];
  if(ov && typeof ov[key]==="number") return ov[key];
  return p[key];
}
function getProduct(id){ for(var i=0;i<PRODUCTS.length;i++) if(PRODUCTS[i].id===id) return PRODUCTS[i]; return null; }
function profileOf(p){ return meterOf(p,"taste")+"-"+meterOf(p,"body")+"-"+meterOf(p,"roast"); }
// 同じ味わいプロフィール（3メーター完全一致）の商品を返す（自分を含む）
function matchingProducts(p){
  var key=profileOf(p);
  return PRODUCTS.filter(function(q){ return profileOf(q)===key; });
}
// メーター距離（逆引きのダミー選定に使う。段階数が違うので幅で正規化）
function meterDistance(a, b){
  var d=0;
  METERS.forEach(function(m){
    var span=m.max-m.min;
    d += Math.abs(meterOf(a,m.key)-meterOf(b,m.key))/span;
  });
  return d;
}

// -------- 進捗 --------
function progOf(id){
  var g=state.progress[id];
  if(!g) return {desc:false, meter:false, reverse:false};
  return {desc:!!g.desc, meter:!!g.meter, reverse:!!g.reverse};
}
function markProg(id, kind){
  var g=state.progress[id] || {};
  g[kind]=true; state.progress[id]=g; saveProgress();
}
function progCount(id){ var g=progOf(id); return (g.desc?1:0)+(g.meter?1:0)+(g.reverse?1:0); }
function overallProgress(){
  if(!PRODUCTS.length) return 0;
  var sum=0;
  PRODUCTS.forEach(function(p){ sum+=progCount(p.id); });
  return sum/(PRODUCTS.length*3);
}
function updateOverall(){
  var p=Math.round(overallProgress()*100);
  var f=$("#overall-fill"); if(f) f.style.width=p+"%";
  var t=$("#overall-pct"); if(t) t.textContent=p+"%";
}
function updateStat(id, correct){
  var st=state.stats[id]||{attempts:0,correct:0,lastSeen:0};
  st.attempts++; if(correct) st.correct++; st.lastSeen=Date.now();
  state.stats[id]=st; saveStats();
}
// 弱点順：未着手→正答率低い→古い の優先で並べる
function weakOrder(){
  return PRODUCTS.slice().sort(function(a,b){
    var sa=state.stats[a.id], sb=state.stats[b.id];
    var ra=sa&&sa.attempts? sa.correct/sa.attempts : -1;
    var rb=sb&&sb.attempts? sb.correct/sb.attempts : -1;
    if(ra!==rb) return ra-rb;
    var ta=sa?sa.lastSeen:0, tb=sb?sb.lastSeen:0;
    return ta-tb;
  });
}

// ==================== メーター表示 ====================
// 値 v を 0〜100% の左位置に変換（両端が中心に来るよう内側にマージンを取る）
function meterPct(m, v){
  var span=m.max-m.min;
  var t=(v-m.min)/span;            // 0..1
  return (6 + t*88);               // 6%..94%
}
function meterBarHtml(m, opts){
  opts=opts||{};
  var h='<div class="meter"><div class="meter-head"><span class="meter-name">'+escapeHtml(m.name)+'</span>';
  h+='<span>'+(opts.showVal? escapeHtml(opts.showVal) : "")+'</span></div>';
  h+='<div class="meter-track '+m.cls+'">';
  if(typeof opts.guess==="number") h+='<div class="meter-dot guess" style="left:'+meterPct(m,opts.guess)+'%"></div>';
  if(typeof opts.value==="number") h+='<div class="meter-dot'+(opts.answerColor?" ans":"")+'" style="left:'+meterPct(m,opts.value)+'%"></div>';
  h+='</div><div class="meter-ends"><span>'+escapeHtml(m.lo)+'</span><span>'+escapeHtml(m.hi)+'</span></div></div>';
  return h;
}
function metersHtml(p){
  var h="";
  METERS.forEach(function(m){
    h+=meterBarHtml(m, {value:meterOf(p,m.key), showVal:meterOf(p,m.key)+" / "+m.max});
  });
  return h;
}
// 判定：0=完全一致、1=惜しい、2以上=不正解
function judgeMeter(guess, answer){
  var d=Math.abs(guess-answer);
  if(d===0) return "perfect";
  if(d===1) return "close";
  return "miss";
}
function judgeScore(j){ return j==="perfect"?1 : (j==="close"?0.5 : 0); }
var JUDGE_LABEL = {perfect:"&#9711; 正解", close:"&#9651; 惜しい", miss:"&#10005; 不正解"};

// ==================== バッジ ====================
function badgesHtml(p){
  var h='<div class="badges">';
  h+='<span class="pill'+(p.category==="order"?" order":(p.category==="straight"?" gray":""))+'">'+escapeHtml(CAT_LABEL[p.category]||p.category)+'</span>';
  if(p.dark) h+='<span class="pill dark">ダークロースト</span>';
  if(p.seasonal) h+='<span class="pill season">季節限定</span>';
  if(p.icons.indexOf("espresso")>=0) h+='<span class="pill esp">Espresso</span>';
  if(p.icons.indexOf("ice")>=0) h+='<span class="pill ice">Ice</span>';
  h+='</div>';
  return h;
}

// ==================== 穴埋め選択肢 ====================
// 正解キーワード1つ＋他商品のキーワードからダミー3つ。重複は pickN が除去する
function buildKeyChoices(product, correctKey){
  var pool=[];
  PRODUCTS.forEach(function(p){
    if(p.id===product.id) return;
    p.keys.forEach(function(k){ if(k!==correctKey) pool.push(k); });
  });
  var dummies=pickN(pool, 3);
  return shuffle([correctKey].concat(dummies));
}

// ==================== 逆引き選択肢 ====================
// 該当商品（同一プロフィール）をちょうど1つだけ含め、残りはメーターが近い非該当から選ぶ
function buildReverseChoices(product){
  var matches=matchingProducts(product);
  var matchIds={};
  matches.forEach(function(m){ matchIds[m.id]=1; });
  var others=PRODUCTS.filter(function(p){ return !matchIds[p.id]; });
  others.sort(function(a,b){ return meterDistance(product,a)-meterDistance(product,b); });
  // 近いものから6件を候補にし、その中から3つ引く（毎回同じ顔ぶれにならないように）
  var dummies=shuffle(others.slice(0, Math.min(6, others.length))).slice(0,3);
  return shuffle([product].concat(dummies));
}

      var idx=rem.indexOf(k);
      if(idx<0) return;
      h+=escapeHtml(rem.slice(0,idx));
      var st=blankState[i];
      var cls="blank"+(st==="ok"?" filled":(st==="ng"?" wrongfill":(i===curBlank?" cur":"")));
      var txt=(st==="ok"||st==="ng")? blankShown[i] : "＿＿＿＿";
      h+='<span class="'+cls+'">'+escapeHtml(txt)+'</span>';
      rem=rem.slice(idx+k.length);
    });
    h+=escapeHtml(rem);
    $("#fw-desc",card).innerHTML=h;
  }
  var blankState=blanks.map(function(){ return ""; });
  var blankShown=blanks.map(function(){ return ""; });
  var curBlank=0, correctCount=0;

  function askBlank(){
    renderDesc();
    if(curBlank>=blanks.length){ finishStep1(); return; }
    var key=blanks[curBlank];
    var choices=buildKeyChoices(product, key);
    var ch=$("#fw-choices",card);
    ch.innerHTML='<div class="muted">空欄 '+(curBlank+1)+' / '+blanks.length+'</div><div class="choices">'+
      choices.map(function(c,i){ return '<button class="choice" data-i="'+i+'">'+escapeHtml(c)+'</button>'; }).join("")+'</div>';
    $all(".choice",ch).forEach(function(btn){
      btn.addEventListener("click", function(){
        var picked=choices[+btn.dataset.i];
        var ok=(picked===key);
        blankShown[curBlank]=ok? key : picked;
        blankState[curBlank]=ok? "ok":"ng";
        if(ok) correctCount++;
        $all(".choice",ch).forEach(function(b2,j){
          b2.classList.add("disabled");
          if(choices[j]===key) b2.classList.add("correct");
        });
        if(!ok) btn.classList.add("wrong");
        curBlank++;
        setTimeout(askBlank, ok? 450 : 1100);
      });
    });
  }
  function finishStep1(){
    $("#fw-choices",card).innerHTML="";
    var allOk=(correctCount===blanks.length);
    var fb=$("#fw-fb",card);
    fb.className="feedback show "+(allOk?"ok":(correctCount>0?"part":"ng"));
    fb.innerHTML="<b>説明文："+correctCount+" / "+blanks.length+" 正解</b>"+
      (allOk? "" : "<br>赤い取り消し線が誤答です。正しい語を確認してください。");
    if(allOk) markProg(product.id,"desc");
    updateStat(product.id, allOk);
    $("#fw-next-row",card).style.display="";
    $("#fw-to-meter",card).addEventListener("click", function(){
      buildMeterStep(product, host, correctCount, blanks.length, done);
    });
  }
  askBlank();
}

// ステップ2：スライダーで3メーターを再現
function buildMeterStep(product, host, descOk, descTotal, done){
  host.innerHTML="";
  var card=el("div","card");
  var h='<div class="step-head">&#9312; 順引き ステップ2／2</div>'+
    '<div class="q-name">'+escapeHtml(product.name)+'</div>'+
    '<div class="muted" style="margin-top:6px;">この商品のテイストバランス・ボディ・ローストをスライダーで合わせてください。</div>';
  METERS.forEach(function(m){
    var mid=Math.round((m.min+m.max)/2);
    h+='<div class="slider-row" data-key="'+m.key+'">'+
       '<div class="slider-label"><span class="nm">'+escapeHtml(m.name)+'</span>'+
       '<span class="val"><b class="cur">'+mid+'</b> / '+m.max+'</span></div>'+
       '<input type="range" min="'+m.min+'" max="'+m.max+'" step="1" value="'+mid+'" data-key="'+m.key+'">'+
       '<div class="slider-scale"><span>'+escapeHtml(m.lo)+'</span><span>'+escapeHtml(m.hi)+'</span></div>'+
       '<div class="judge-row" data-judge="'+m.key+'"></div>'+
       '</div>';
  });
  h+='<div class="btn-row"><button class="btn btn-primary" id="mt-check">この値で回答する</button></div>'+
     '<div class="feedback" id="mt-fb"></div>'+
     '<div class="btn-row" id="mt-next-row" style="display:none;"><button class="btn btn-primary" id="mt-next">次へ &#8594;</button></div>';
  card.innerHTML=h;
  host.appendChild(card);

  $all("input[type=range]",card).forEach(function(r){
    r.addEventListener("input", function(){
      $(".cur", r.closest(".slider-row")).textContent=r.value;
    });
  });

  var answered=false;
  $("#mt-check",card).addEventListener("click", function(){
    if(answered) return; answered=true;
    var score=0, detail="";
    METERS.forEach(function(m){
      var row=$('.slider-row[data-key="'+m.key+'"]',card);
      var guess=+$("input[type=range]",row).value;
      var ans=meterOf(product,m.key);
      $(".cur",row).textContent=guess;   // 回答時点の値でラベルを確定させる
      var j=judgeMeter(guess, ans);
      score+=judgeScore(j);
      $("input[type=range]",row).disabled=true;
      // スライダーの下に「自分の回答＝橙／正解＝緑」を重ねた帯を出してズレを見せる
      var bar=el("div",null, meterBarHtml(m,{guess:guess, value:ans, answerColor:true,
        showVal:"あなた "+guess+" ／ 正解 "+ans}));
      row.appendChild(bar);
      $('[data-judge="'+m.key+'"]',card).innerHTML='<span class="judge '+j+'">'+JUDGE_LABEL[j]+'</span>';
      detail+=m.name+"："+guess+"→"+ans+"　";
    });
    var pass=(score>=2);
    if(pass) markProg(product.id,"meter");
    updateStat(product.id, pass);
    var fb=$("#mt-fb",card);
    fb.className="feedback show "+(score>=2.5?"ok":(pass?"part":"ng"));
    fb.innerHTML="<b>メーター得点："+score.toFixed(1)+" / 3.0</b>"+
      (pass? "　この商品のメーターは習得とみなします。" : "　2.0 以上で習得です。もう一度挑戦しましょう。")+
      '<div class="muted" style="margin-top:6px;">'+escapeHtml(product.cat)+"</div>";
    $("#mt-check",card).disabled=true;
    $("#mt-next-row",card).style.display="";
    $("#mt-next",card).addEventListener("click", function(){
      if(done) done({descOk:descOk, descTotal:descTotal, meterScore:score, pass:pass});
    });
    updateOverall();
  });
}

function buildReverseQuestion(product, host, done){
  host.innerHTML="";
  var card=el("div","card");
  var choices=buildReverseChoices(product);
  var h='<div class="step-head">&#9313; 逆引き</div>'+
    '<div class="muted">次の味わいプロフィールに合う商品はどれでしょう。</div>';
  METERS.forEach(function(m){
    h+=meterBarHtml(m,{value:meterOf(product,m.key), showVal:meterOf(product,m.key)+" / "+m.max});
  });
  h+='<div class="q-desc" style="font-weight:700;color:var(--accent-dark);margin-top:10px;">'+escapeHtml(product.cat)+'</div>';
  h+='<div class="choices">'+choices.map(function(c,i){
       return '<button class="choice" data-i="'+i+'">'+escapeHtml(c.name)+'<span class="muted"> '+escapeHtml(c.nameEn)+'</span></button>';
     }).join("")+'</div>';
  h+='<div class="btn-row"><button class="btn btn-sm" id="rv-hint">ヒント</button></div><div id="rv-hints"></div>';
  h+='<div class="feedback" id="rv-fb"></div>'+
     '<div class="btn-row" id="rv-next-row" style="display:none;"><button class="btn btn-primary" id="rv-next">次へ &#8594;</button></div>';
  card.innerHTML=h;
  host.appendChild(card);

  var hints=[
    "カテゴリ："+(CAT_LABEL[product.category]||product.category)+(product.dark?"（ダークロースト）":""),
    product.origin? ("生豆生産国："+product.origin) : "ブレンド商品です（単一産地ではありません）"
  ];
  var hi=0;
  $("#rv-hint",card).addEventListener("click", function(){
    if(hi<hints.length){ $("#rv-hints",card).appendChild(el("div","hint-box","ヒント"+(hi+1)+"： "+escapeHtml(hints[hi]))); hi++; }
    if(hi>=hints.length) this.disabled=true;
  });

  var matches=matchingProducts(product);
  var answered=false;
  $all(".choice",card).forEach(function(btn){
    btn.addEventListener("click", function(){
      if(answered) return; answered=true;
      var picked=choices[+btn.dataset.i];
      // 「1つ選べば正解」：同一プロフィールの商品ならどれでも正解扱い
      var ok = matches.some(function(m){ return m.id===picked.id; });
      $all(".choice",card).forEach(function(b2,j){
        b2.classList.add("disabled");
        if(matches.some(function(m){ return m.id===choices[j].id; })) b2.classList.add("correct");
      });
      if(!ok) btn.classList.add("wrong");
      if(ok) markProg(product.id,"reverse");
      updateStat(product.id, ok);
      var others=matches.filter(function(m){ return m.id!==picked.id; });
      var fb=$("#rv-fb",card);
      fb.className="feedback show "+(ok?"ok":"ng");
      var body=(ok? "<b>正解</b> ":"<b>不正解</b> 正解は <b>"+escapeHtml(product.name)+"</b> ")+
        '<div style="margin-top:6px;">'+escapeHtml(product.desc)+'</div>';
      if(others.length){
        body+='<div class="muted" style="margin-top:6px;">同じ味わいプロフィールの商品：'+
              others.map(function(m){ return escapeHtml(m.name); }).join("、")+'</div>';
      }
      fb.innerHTML=body;
      $("#rv-next-row",card).style.display="";
      $("#rv-next",card).addEventListener("click", function(){ if(done) done({correct:ok}); });
      updateOverall();
    });
  });
}

// ==================== 総合（①②をシャッフル） ====================
var mixSession=null;
function startMixSession(pool){
  var n=state.settings.sessionLen;
  var items=[];
  var src=pool && pool.length? pool : PRODUCTS;
  shuffle(src).slice(0,n).forEach(function(p){
    items.push({product:p, kind: Math.random()<0.5? "forward":"reverse"});
  });
  mixSession={items:items, idx:0, correct:0, retry:[]};
  renderMix();
}
function renderMix(){
  var p=$("#panel-mix");
  if(!mixSession){
    p.innerHTML='<div class="section-title">総合セッション</div>'+
      '<div class="card"><p class="muted">順引きと逆引きをシャッフルして '+state.settings.sessionLen+' 問出題します。間違えた商品は最後にもう一度出ます。</p>'+
      '<div class="btn-row"><button class="btn btn-primary" id="mx-start">開始（全商品から）</button>'+
      '<button class="btn" id="mx-weak">開始（弱点優先）</button></div></div>';
    $("#mx-start",p).addEventListener("click", function(){ startMixSession(PRODUCTS); });
    $("#mx-weak",p).addEventListener("click", function(){ startMixSession(weakOrder().slice(0, Math.max(state.settings.sessionLen*2,10))); });
    return;
  }
  if(mixSession.idx>=mixSession.items.length){
    // 誤答分を1巡だけ追加する
    if(mixSession.retry.length){
      var again=mixSession.retry.slice();
      mixSession.retry=[];
      mixSession.items=mixSession.items.concat(again);
      renderMix(); return;
    }
    var total=mixSession.items.length;
    var pct=total? Math.round(mixSession.correct/total*100):0;
    p.innerHTML='<div class="section-title">総合セッション：終了</div>'+
      '<div class="card"><div class="stat-row"><div class="stat"><div class="v">'+mixSession.correct+' / '+total+'</div><div class="l">正解数</div></div>'+
      '<div class="stat"><div class="v">'+pct+'%</div><div class="l">正答率</div></div></div>'+
      '<div class="btn-row"><button class="btn btn-primary" id="mx-again">もう一度</button></div></div>';
    $("#mx-again",p).addEventListener("click", function(){ mixSession=null; renderMix(); });
    return;
  }
  var cur=mixSession.items[mixSession.idx];
  p.innerHTML='<div class="section-title">総合セッション</div>'+
    '<div class="sess-bar"><span>'+(mixSession.idx+1)+' / '+mixSession.items.length+' 問目</span>'+
    '<span><button class="btn btn-sm" id="mx-quit">中断</button></span></div><div id="mx-host"></div>';
  $("#mx-quit",p).addEventListener("click", function(){ mixSession=null; renderMix(); });
  var host=$("#mx-host",p);
  function next(res){
    var ok = (cur.kind==="forward")? !!(res && res.pass) : !!(res && res.correct);
    if(ok) mixSession.correct++;
    else mixSession.retry.push({product:cur.product, kind:cur.kind});
    mixSession.idx++;
    renderMix();
  }
  if(cur.kind==="forward") buildForwardQuestion(cur.product, host, next);
  else buildReverseQuestion(cur.product, host, next);
}

      inp.addEventListener("change", function(){
        var m=meterDef(inp.dataset.key);
        var v=Math.round(+inp.value);
        if(isNaN(v)) v=meterOf(getProduct(id), m.key);
        v=Math.max(m.min, Math.min(m.max, v));
        inp.value=v;
        var ov=state.overrides[id]||{};
        ov[m.key]=v; state.overrides[id]=ov; saveOverrides();
        row.classList.add("edited");
      });
    });
  });
  $("#st-reset-ov",p).addEventListener("click", function(){
    if(!confirm("メーター値の修正をすべて取り消し、初期値に戻します。よろしいですか？")) return;
    state.overrides={}; saveOverrides(); renderSettings();
  });
  $("#st-export",p).addEventListener("click", function(){
    $("#st-json",p).value=JSON.stringify(state.overrides, null, 2);
  });
  $("#st-import",p).addEventListener("click", function(){
    var t=$("#st-json",p).value.trim();
    if(!t){ alert("読み込む JSON を貼り付けてください。"); return; }
    try{
      var o=JSON.parse(t);
      if(!o || typeof o!=="object" || Array.isArray(o)) throw new Error("オブジェクト形式ではありません");
      state.overrides=o; saveOverrides(); renderSettings();
      alert("読み込みました。");
    }catch(e){ alert("JSON を読み込めませんでした：" + e.message); }
  });
  $("#st-reset-prog",p).addEventListener("click", function(){
    if(!confirm("学習進捗と成績をすべて消去します。よろしいですか？（メーター修正値は残ります）")) return;
    state.progress={}; state.stats={}; saveProgress(); saveStats();
    renderSettings(); updateOverall();
  });
  $("#st-rerun",p).addEventListener("click", function(){ showSelfTest(runSelfTest()); });
  showSelfTest(lastSelfTest);
}
function showSelfTest(res){
  var host=$("#st-log"); if(!host || !res) return;
  var head=(res.pass?'<span class="st-ok">PASS</span>':'<span class="st-ng">FAIL</span>')+
    "  checks="+res.checks+" fails="+res.fails.length+" warns="+res.warns.length+"\n\n";
  var body=res.fails.map(function(l){ return '<span class="st-ng">[NG] '+escapeHtml(l)+'</span>'; })
    .concat(res.warns.map(function(l){ return '<span class="st-wn">[WARN] '+escapeHtml(l)+'</span>'; }))
    .join("\n");
  host.innerHTML=head+(body||'<span class="st-ok">すべての検査に合格しました。</span>');
}
// ==================== selfTest ====================
var lastSelfTest=null;
var EXPECTED_COUNT=30;

function runSelfTest(){
  var checks=0, fails=[], warns=[];
  function ok(label, cond){ checks++; if(!cond) fails.push(label); }
  function eq(label, a, b){ checks++; if(a!==b) fails.push(label+"（実際: "+a+" / 期待: "+b+"）"); }

  try{
    // ---- D1: id の一意性 ----
    var seen={}, dup=[];
    PRODUCTS.forEach(function(p){ if(seen[p.id]) dup.push(p.id); seen[p.id]=1; });
    ok("D1 商品idが重複: "+dup.join(","), dup.length===0);

    // ---- D2: 必須項目が非空 ----
    PRODUCTS.forEach(function(p){
      ok("D2 "+p.id+" name が空", !!p.name);
      ok("D2 "+p.id+" nameEn が空", !!p.nameEn);
      ok("D2 "+p.id+" cat（惹句）が空", !!p.cat);
      ok("D2 "+p.id+" desc が空", !!p.desc);
    });

    // ---- D3: メーター値域 ----
    PRODUCTS.forEach(function(p){
      METERS.forEach(function(m){
        var v=p[m.key];
        ok("D3 "+p.id+" "+m.key+"="+v+" が範囲外/非整数",
           typeof v==="number" && v===Math.round(v) && v>=m.min && v<=m.max);
      });
    });

    // ---- D4: keys が desc に実在する（穴埋めが成立する保証） ----
    PRODUCTS.forEach(function(p){
      ok("D4 "+p.id+" keys が空", p.keys && p.keys.length>0);
      (p.keys||[]).forEach(function(k){
        ok("D4 "+p.id+" キーワード「"+k+"」が desc に見つからない", p.desc.indexOf(k)>=0);
      });
      // 同じ商品内でキーワードが重複していると穴埋めの置換位置がずれる
      var ks={}, kdup=false;
      (p.keys||[]).forEach(function(k){ if(ks[k]) kdup=true; ks[k]=1; });
      ok("D4 "+p.id+" キーワードが重複", !kdup);
    });

    // ---- D5: カテゴリとorigin ----
    PRODUCTS.forEach(function(p){
      ok("D5 "+p.id+" category が不正: "+p.category, ["blend","straight","order"].indexOf(p.category)>=0);
      if(p.category==="straight" || p.category==="order"){
        ok("D5 "+p.id+" ストレート/お取り寄せなのに origin が無い", !!p.origin);
      }
      if(p.category==="blend"){
        ok("D5 "+p.id+" ブレンドなのに origin がある", p.origin===null);
      }
      ok("D5 "+p.id+" icons が配列でない", Object.prototype.toString.call(p.icons)==="[object Array]");
    });

    // ---- D6: 商品数 ----
    eq("D6 商品数", PRODUCTS.length, EXPECTED_COUNT);

    // ---- Q1: 穴埋め選択肢生成（全商品×全キー） ----
    PRODUCTS.forEach(function(p){
      (p.keys||[]).forEach(function(k){
        var ch=buildKeyChoices(p,k);
        eq("Q1 "+p.id+" 選択肢数", ch.length, 4);
        var cnt=0, s={}, d=false;
        ch.forEach(function(c){ if(c===k) cnt++; if(s[c]) d=true; s[c]=1; });
        eq("Q1 "+p.id+" 正解の個数", cnt, 1);
        ok("Q1 "+p.id+" 選択肢が重複", !d);
      });
    });

    // ---- Q2: 逆引き選択肢生成（該当商品はちょうど1つ） ----
    PRODUCTS.forEach(function(p){
      var ch=buildReverseChoices(p);
      eq("Q2 "+p.id+" 選択肢数", ch.length, 4);
      var matches=matchingProducts(p), mids={};
      matches.forEach(function(m){ mids[m.id]=1; });
      var hit=0, s={}, d=false;
      ch.forEach(function(c){ if(mids[c.id]) hit++; if(s[c.id]) d=true; s[c.id]=1; });
      eq("Q2 "+p.id+" 該当商品の個数", hit, 1);
      ok("Q2 "+p.id+" 選択肢が重複", !d);
      ok("Q2 "+p.id+" 正解が選択肢に含まれない", ch.some(function(c){ return c.id===p.id; }));
    });

    // ---- Q3: judgeMeter の境界 ----
    eq("Q3 d=0", judgeMeter(5,5), "perfect");
    eq("Q3 d=1(上)", judgeMeter(6,5), "close");
    eq("Q3 d=1(下)", judgeMeter(4,5), "close");
    eq("Q3 d=2", judgeMeter(7,5), "miss");
    eq("Q3 得点 perfect", judgeScore("perfect"), 1);
    eq("Q3 得点 close", judgeScore("close"), 0.5);
    eq("Q3 得点 miss", judgeScore("miss"), 0);

    // ---- Q4: meterPct が 0-100% に収まる ----
    METERS.forEach(function(m){
      for(var v=m.min; v<=m.max; v++){
        var pc=meterPct(m,v);
        ok("Q4 "+m.key+"="+v+" の位置が範囲外: "+pc, pc>=0 && pc<=100);
      }
    });

    // ---- Q5: override が meterOf / profileOf に反映される ----
    (function(){
      var p0=PRODUCTS[0];
      var backup=state.overrides[p0.id];
      var orig=meterOf(p0,"taste");
      var alt=(orig===1? 2 : 1);
      state.overrides[p0.id]=Object.assign({}, backup||{}, {taste:alt});
      eq("Q5 override がmeterOfに反映", meterOf(p0,"taste"), alt);
      ok("Q5 override がprofileOfに反映", profileOf(p0).indexOf(alt+"-")===0);
      if(backup) state.overrides[p0.id]=backup; else delete state.overrides[p0.id];
      eq("Q5 override の後始末", meterOf(p0,"taste"), orig);
    })();

    // ---- M1: localStorage 往復（専用キーで書き→読み→削除） ----
    (function(){
      var k="rikei.coffee.selftest";
      try{
        localStorage.setItem(k, JSON.stringify({a:1}));
        var got=JSON.parse(localStorage.getItem(k));
        eq("M1 localStorage 往復", got&&got.a, 1);
        localStorage.removeItem(k);
        ok("M1 テスト用キーの後始末", localStorage.getItem(k)===null);
      }catch(e){
        warns.push("M1 localStorage が使えません（進捗は保存されません）: "+e.message);
      }
    })();

    // ---- W1: メーター読み取り精度の警告 ----
    var low=PRODUCTS.filter(function(p){ return p.meterConf==="low" && !state.overrides[p.id]; });
    if(low.length){
      warns.push("W1 メーター値が写真からの推定のままの商品が "+low.length+" 件あります（設定タブで実物に合わせて修正できます）");
    }
  }catch(e){
    fails.push("例外: "+(e && e.message ? e.message : String(e)));
  }

  var pass=(fails.length===0);
  lastSelfTest={pass:pass, checks:checks, fails:fails, warns:warns};
  var summary="SELFTEST:"+(pass?"PASS":"FAIL")+" | checks="+checks+" fails="+fails.length+" warns="+warns.length;
  window.__selftest=lastSelfTest;
  window.__selftestSummary=summary;
  try{
    console.log("%c[コーヒーアプリ "+summary+"]","font-weight:bold;color:"+(pass?"green":"red"));
    fails.forEach(function(l){ console.log("[NG] "+l); });
    warns.forEach(function(l){ console.log("[WARN] "+l); });
  }catch(e){}
  return lastSelfTest;
}

// ==================== 起動 ====================
function init(){
  loadState();
  buildTabbar();
  runSelfTest();
  var g=$("#gear-btn");
  if(g) g.addEventListener("click", function(){ switchTab("settings"); });
  switchTab("home");
  updateOverall();
}
window.addEventListener("DOMContentLoaded", init);
</script>
